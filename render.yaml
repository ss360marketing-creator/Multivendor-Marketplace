services:
  # 🌐 Backend Fastify API Web Service
  - type: web
    name: multivendor-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"
      - key: DATABASE_URL
        fromDatabase:
          name: multivendor-db
          property: connectionString

  # 🎨 Frontend React + Vite Static Site
  - type: web
    name: multivendor-frontend
    runtime: static
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  # 🗄️ PostgreSQL Database
  - name: multivendor-db
    plan: free
    databaseName: multivendor
    user: multivendor_user
